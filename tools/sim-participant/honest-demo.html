<!doctype html>
<meta charset="utf-8">
<title>RoboMeet honest stress test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #202124; font-family: 'Inter', system-ui, 'DejaVu Sans', sans-serif; color: #e8eaed; }
  #top { position: absolute; left: 32px; right: 32px; top: 16px; height: 44px; display: flex; justify-content: space-between; align-items: center; }
  #top .brand { font-size: 22px; font-weight: 600; } #top .brand span { color: #9aa0a6; font-weight: 400; }
  #top .where { font-size: 19px; color: #9aa0a6; text-align: right; }
  #stage { position: absolute; left: 32px; top: 70px; width: 1344px; height: 756px; border-radius: 12px; overflow: hidden; background: #000; }
  #stage img { width: 100%; height: 100%; display: block; }
  #stage .tag { position: absolute; left: 12px; bottom: 10px; background: rgba(32,33,36,.85); padding: 5px 11px; border-radius: 6px; font-size: 15px; color: #bdc1c6; }
  #stage .badge { position: absolute; right: 12px; top: 12px; background: rgba(138,180,248,.92); color: #202124; padding: 6px 12px; border-radius: 6px; font-size: 17px; font-weight: 600; display: none; }
  #side { position: absolute; left: 1400px; top: 70px; width: 488px; }
  .tile { position: relative; width: 488px; height: 196px; margin-bottom: 14px; border-radius: 12px; overflow: hidden; background: #3c4043; outline: 4px solid transparent; }
  .tile.speaking { outline-color: #8ab4f8; }
  .tile canvas { width: 100%; height: 100%; display: block; }
  .tile .name { position: absolute; left: 10px; bottom: 8px; background: rgba(32,33,36,.8); padding: 3px 9px; border-radius: 6px; font-size: 16px; }
  #card { position: absolute; left: 1400px; top: 490px; width: 488px; height: 336px; background: #2d2e31; border-radius: 12px; padding: 16px 18px; }
  #card .kicker { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #8ab4f8; margin-bottom: 6px; padding-right: 180px; min-height: 16px; }
  #card .title { font-size: 21px; font-weight: 600; line-height: 1.25; margin-bottom: 8px; }
  #card .need { font-size: 15px; color: #bdc1c6; line-height: 1.35; margin-bottom: 10px; }
  #card .v { font-size: 16px; line-height: 1.5; }
  #card .v div { display: flex; gap: 8px; } #card .v .m { width: 20px; font-weight: 700; text-align: center; }
  #card .v .ok .m { color: #81c995; } #card .v .no .m { color: #f28b82; } #card .v .wait { color: #80868b; }
  #card .why { font-size: 13.5px; color: #f6aea9; margin-top: 6px; line-height: 1.3; }
  #card .stamp { position: absolute; right: 16px; top: 14px; font-size: 15px; font-weight: 700; padding: 3px 10px; border-radius: 6px; }
  #card .stamp.pass { background: #1e8e3e; } #card .stamp.fail { background: #c5221f; } #card .stamp.fixed { background: #1a73e8; }
  #cap { position: absolute; left: 32px; right: 32px; top: 842px; height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  #cap .who { font-size: 19px; color: #8ab4f8; margin-bottom: 6px; font-weight: 600; }
  #cap .text { font-size: 28px; line-height: 1.35; max-width: 1760px; background: rgba(0,0,0,.5); padding: 10px 22px; border-radius: 8px; }
  #full { position: absolute; inset: 0; background: #202124; display: none; flex-direction: column; justify-content: center; padding: 0 140px; }
  #full h1 { font-size: 64px; font-weight: 700; margin-bottom: 18px; line-height: 1.1; }
  #full h2 { font-size: 30px; font-weight: 400; color: #bdc1c6; margin-bottom: 30px; line-height: 1.35; }
  #full ul { list-style: none; font-size: 25px; line-height: 1.5; color: #e8eaed; }
  #full li { display: flex; gap: 14px; } #full li .m { width: 30px; font-weight: 700; }
  #full li.ok .m { color: #81c995; } #full li.no .m { color: #f28b82; } #full li.fx .m { color: #8ab4f8; } #full li.nb .m { color: #fdd663; }
  #full table { border-collapse: collapse; font-size: 22px; margin-top: 8px; }
  #full td, #full th { padding: 7px 18px; text-align: left; border-bottom: 1px solid #3c4043; }
  #full th { color: #9aa0a6; font-weight: 500; font-size: 18px; }
  #full .n { text-align: right; font-variant-numeric: tabular-nums; }
</style>
<div id="top"><div class="brand">RoboMeet <span>· simulated-colleague test · Alex says only scripted lines and cannot hear the meeting</span></div><div class="where"></div></div>
<div id="stage"><img id="shot"><div class="tag">Vivek Bot's shared screen · rendered by the real src/meet-stage.js</div><div class="badge"></div></div>
<div id="side">
  <div class="tile" id="t-robot"><div class="name">Vivek Bot (robot)</div></div>
  <div class="tile" id="t-alex"><div class="name">Alex (simulated tester, GPT Live)</div></div>
</div>
<div id="card"></div>
<div id="cap"><div class="who"></div><div class="text"></div></div>
<div id="full"></div>
<script src="/src/face.js"></script>
<script>
(async () => {
  const demo = await (await fetch(new URLSearchParams(location.search).get('demo'))).json();
  const robotFace = RoboMeetFace.create({ character: 'robot', name: 'Vivek Bot', width: 1280, height: 560 });
  const alexFace = RoboMeetFace.create({ character: 'human', name: 'Alex', width: 1280, height: 560 });
  document.getElementById('t-robot').prepend(robotFace.canvas);
  document.getElementById('t-alex').prepend(alexFace.canvas);
  for (const f of [robotFace, alexFace]) { f.stop(); f.detachAudio?.(); }
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let shown = null;
  function verdict(v, revealed) {
    if (!v) return '';
    const row = (ok, label, detail = '') => revealed ? `<div class="${ok ? 'ok' : 'no'}"><span class="m">${ok ? '✓' : '✗'}</span><span>${label}${detail ? ` <span style="color:#9aa0a6">· ${esc(detail)}</span>` : ''}</span></div>` : `<div class="wait"><span class="m">·</span><span>${label}</span></div>`;
    return `<div class="v">${row(v.did, 'Did it', v.didNote)}${row(v.conveyed, 'Content right (LLM judge)')}${row(v.clean, 'Nothing false, no rule broken')}${row(v.felt, 'Felt right', v.feelNote)}</div>${revealed && v.why ? `<div class="why">${esc(v.why)}</div>` : ''}`;
  }
  window.__demo = {
    duration: demo.duration, ready: true,
    renderFrame(i, fps) {
      const t = i / fps, f = Math.min(demo.frames.length - 1, i);
      const seg = demo.segments.find(s => t >= s.start && t < s.end) || demo.segments.at(-1);
      const full = $('#full');
      if (seg.kind === 'card') {
        full.style.display = 'flex';
        if (shown !== seg) { full.innerHTML = seg.html; shown = seg; }
        return;
      }
      full.style.display = 'none'; shown = null;
      $('#top .where').textContent = seg.where || '';
      const st = seg.screens.filter(s => s.at <= t).at(-1) || seg.screens[0];
      if (st && $('#shot').getAttribute('src') !== st.src) $('#shot').setAttribute('src', st.src);
      const badge = (seg.badges || []).find(b => t >= b.at && t < b.at + 2.2);
      $('#stage .badge').style.display = badge ? 'block' : 'none'; if (badge) $('#stage .badge').textContent = badge.text;
      const revealed = t >= seg.revealAt;
      $('#card').innerHTML = `${revealed ? `<div class="stamp ${seg.stamp}">${seg.stampText}</div>` : ''}<div class="kicker">${esc(seg.kicker)}</div><div class="title">${esc(seg.title)}</div><div class="need">${esc(seg.need)}</div>${verdict(seg.verdict, revealed)}`;
      const c = seg.captions.filter(x => x.sec <= t && t <= x.end + 0.5).at(-1);
      $('#cap .who').textContent = c ? c.who : ''; $('#cap .text').textContent = c ? c.text : ''; $('#cap .text').style.visibility = c ? 'visible' : 'hidden';
      const fr = demo.frames[f] || { r: [0, .5], a: [0, .5] };
      robotFace.setBands(fr.r[0], fr.r[1]); robotFace.advance(1 / fps);
      alexFace.setBands(fr.a[0], fr.a[1]); alexFace.advance(1 / fps);
      $('#t-robot').classList.toggle('speaking', robotFace.state().level > 0.12);
      $('#t-alex').classList.toggle('speaking', alexFace.state().level > 0.12);
    },
  };
})();
</script>
