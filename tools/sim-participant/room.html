<!doctype html>
<meta charset="utf-8">
<title>RoboMeet — simulated meeting</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #202124; font-family: system-ui, 'DejaVu Sans', sans-serif; color: #e8eaed; }
  #top { position: absolute; left: 32px; right: 32px; top: 18px; height: 40px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; }
  #top b { font-weight: 600; }
  #top .note { color: #9aa0a6; font-size: 19px; }
  #main { position: absolute; left: 32px; top: 70px; width: 1410px; height: 794px; background: #000; border-radius: 12px; overflow: hidden; }
  #main canvas { width: 100%; height: 100%; display: block; }
  #main .tag { position: absolute; left: 14px; bottom: 12px; background: rgba(32,33,36,.85); padding: 6px 12px; border-radius: 6px; font-size: 18px; }
  #side { position: absolute; left: 1462px; top: 70px; width: 426px; }
  .tile { position: relative; width: 426px; height: 240px; margin-bottom: 18px; border-radius: 12px; overflow: hidden; background: #3c4043; outline: 4px solid transparent; transition: outline-color .12s; }
  .tile.speaking { outline-color: #8ab4f8; }
  .tile canvas { width: 100%; height: 100%; display: block; }
  .tile .name { position: absolute; left: 12px; bottom: 10px; background: rgba(32,33,36,.8); padding: 4px 10px; border-radius: 6px; font-size: 17px; }
  #legend { position: absolute; left: 1462px; top: 588px; width: 426px; font-size: 15.5px; line-height: 1.35; color: #9aa0a6; }
  #legend .h { color: #e8eaed; font-weight: 600; font-size: 16px; margin-bottom: 6px; }
  #legend .row { display: flex; gap: 8px; padding: 2px 0; }
  #legend .row .m { width: 18px; text-align: center; font-weight: 700; }
  #legend .row.now { color: #e8eaed; }
  #legend .row.pass .m { color: #81c995; } #legend .row.fail .m { color: #f28b82; }
  #cap { position: absolute; left: 32px; right: 32px; top: 884px; height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  #cap .who { font-size: 20px; color: #8ab4f8; margin-bottom: 6px; font-weight: 600; }
  #cap .text { font-size: 30px; line-height: 1.35; max-width: 1700px; background: rgba(0,0,0,.55); padding: 10px 22px; border-radius: 8px; }
  #step { position: absolute; right: 32px; top: 884px; font-size: 17px; color: #9aa0a6; }
</style>
<div id="top"><div><b>Projectile motion</b> · meeting with Vivek Bot</div><div class="note">Both voices are GPT Live · each face moves with its own voice</div></div>
<div id="main"><canvas id="stage" width="1920" height="1080"></canvas><div class="tag">Vivek Bot is presenting</div></div>
<div id="side">
  <div class="tile" id="t-robot"><div class="name">Vivek Bot</div></div>
  <div class="tile" id="t-alex"><div class="name">Alex (simulated tester)</div></div>
</div>
<div id="legend"></div>
<div id="cap"><div class="who"></div><div class="text"></div></div>
<script src="/src/face.js"></script>
<script>
(async () => {
  const run = new URLSearchParams(location.search).get('run');
  const tl = await (await fetch(`${run}/timeline.json`)).json();
  // The robot's shared screen: the exact view renders, with the box painted the way src/meet-stage.js paints it.
  const imgs = await Promise.all(tl.views.map(v => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = v.asset; })));
  const stage = document.getElementById('stage'), sx = stage.getContext('2d');
  function drawStage(view, box) {
    const v = tl.views[view] || tl.views[0], img = imgs[view] || imgs[0];
    sx.fillStyle = '#000'; sx.fillRect(0, 0, 1920, 1080); sx.drawImage(img, 0, 0, 1920, 1080);
    if (!box) return;
    const mx = 1920 / v.w, my = 1080 / v.h, pad = 14;
    const x = (box.x - v.x) * mx - pad, y = (box.y - v.y) * my - pad, w = box.w * mx + pad * 2, h = box.h * my + pad * 2;
    sx.save(); sx.fillStyle = 'rgba(251,188,4,0.10)'; sx.strokeStyle = '#f9ab00'; sx.lineWidth = 6; sx.shadowColor = 'rgba(249,171,0,0.55)'; sx.shadowBlur = 18;
    sx.beginPath(); sx.roundRect(x, y, w, h, 16); sx.fill(); sx.stroke(); sx.restore();
  }
  // Two faces, each analysing only its own voice.
  const robotFace = RoboMeetFace.create({ character: 'robot', name: 'Vivek Bot', width: 1280, height: 720 });
  const alexFace = RoboMeetFace.create({ character: 'human', name: 'Alex', width: 1280, height: 720 });
  document.getElementById('t-robot').prepend(robotFace.canvas);
  document.getElementById('t-alex').prepend(alexFace.canvas);
  const ctx = new AudioContext();
  const load = async name => ctx.decodeAudioData(await (await fetch(`${run}/${name}`)).arrayBuffer());
  const [robotBuf, alexBuf] = await Promise.all([load('robot.wav'), load('alex.wav')]);
  function voice(buffer, face) {
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const toFace = ctx.createMediaStreamDestination();
    src.connect(ctx.destination); src.connect(toFace);
    face.attachAudio(toFace.stream);
    return src;
  }
  const sources = [voice(robotBuf, robotFace), voice(alexBuf, alexFace)];
  // The test checklist: step i starts when Alex starts her i-th turn; its verdict shows once the next one starts.
  const legend = document.getElementById('legend');
  const steps = tl.results || [];
  const alexTurns = tl.captions.filter(c => c.who === 'Alex').map(c => c.sec);
  legend.innerHTML = '<div class="h">Live test · graded against the robot\'s real screen state</div>' +
    steps.map((r, i) => `<div class="row" id="st${i}"><span class="m"></span><span>${r.why}${r.firstVerdict ? ' *' : ''}</span></div>`).join('') +
    (steps.some(r => r.firstVerdict) ? '<div style="margin-top:6px;font-size:13.5px">* re-graded: the grader missed that the tool ran</div>' : '');
  function markSteps(t) {
    steps.forEach((r, i) => {
      const el = document.getElementById(`st${i}`); if (!el) return;
      const started = alexTurns[i] !== undefined && t >= alexTurns[i];
      const ended = (alexTurns[i + 1] !== undefined && t >= alexTurns[i + 1]) || (i === steps.length - 1 && t >= window.__room.duration - 1);
      el.className = 'row' + (ended ? (r.pass ? ' pass' : ' fail') : started ? ' now' : '');
      el.querySelector('.m').textContent = ended ? (r.pass ? '✓' : '✗') : started ? '›' : '';
    });
  }
  // Deterministic mode: the same measurement the live analyser makes, taken from the 1024 samples just before t.
  const clamp01 = v => Math.max(0, Math.min(1, v));
  function bands(buf, t) {
    const d = buf.getChannelData(0), sr = buf.sampleRate, end = Math.min(d.length, Math.floor(t * sr)), start = Math.max(0, end - 1024);
    const a = Math.exp(-2 * Math.PI * 900 / sr); let sum = 0, lp = 0, lo = 0, hi = 0;
    for (let i = start; i < end; i++) { const x = d[i]; sum += x * x; lp = a * lp + (1 - a) * x; lo += lp * lp; const h = x - lp; hi += h * h; }
    const rms = Math.sqrt(sum / Math.max(1, end - start)), sl = Math.sqrt(lo), sh = Math.sqrt(hi);
    return { level: clamp01((rms - 0.008) * 9), low: sl + sh > 0 ? sl / (sl + sh) : 0.5 };
  }
  window.__room = {
    duration: Math.max(robotBuf.duration, alexBuf.duration),
    ready: true,
    renderFrame(i, fps) {
      if (i === 0) { for (const f of [robotFace, alexFace]) { f.stop(); f.detachAudio(); } } // no timers, no live analyser: every frame is stepped from the measured bands
      const t = i / fps, tickIndex = Math.max(0, Math.floor(t * 1000 / tl.tickMs));
      let cur = tl.screen[0] || { view: 0, box: null };
      for (const s of tl.screen) if (s.tick <= tickIndex) cur = s; else break;
      drawStage(cur.view, cur.box);
      const c = tl.captions.filter(x => x.sec <= t && t <= x.end + 0.6).at(-1);
      document.querySelector('#cap .who').textContent = c ? c.who : '';
      document.querySelector('#cap .text').textContent = c ? c.text : '';
      document.querySelector('#cap .text').style.visibility = c ? 'visible' : 'hidden';
      for (const [face, buf, tile] of [[robotFace, robotBuf, 't-robot'], [alexFace, alexBuf, 't-alex']]) {
        const b = bands(buf, t); face.setBands(b.level, b.low); face.advance(1 / fps);
        document.getElementById(tile).classList.toggle('speaking', face.state().level > 0.12);
      }
      markSteps(t);
    },
    start() {
      ctx.resume();
      const at = ctx.currentTime + 0.3;
      sources.forEach(s => s.start(at));
      const tick = () => {
        const t = ctx.currentTime - at;
        const tickIndex = Math.max(0, Math.floor(t * 1000 / tl.tickMs));
        let cur = tl.screen[0] || { view: 0, box: null };
        for (const s of tl.screen) if (s.tick <= tickIndex) cur = s; else break;
        drawStage(cur.view, cur.box);
        const c = tl.captions.filter(x => x.sec <= t && t <= x.end + 0.6).at(-1);
        document.querySelector('#cap .who').textContent = c ? c.who : '';
        document.querySelector('#cap .text').textContent = c ? c.text : '';
        document.querySelector('#cap .text').style.visibility = c ? 'visible' : 'hidden';
        document.getElementById('t-robot').classList.toggle('speaking', robotFace.state().level > 0.12);
        document.getElementById('t-alex').classList.toggle('speaking', alexFace.state().level > 0.12);
        markSteps(t);
        if (t < window.__room.duration + 1) setTimeout(tick, 40);
      };
      tick();
    },
  };
  drawStage(tl.screen[0]?.view || 0, null);
})();
</script>
